      - name: Corregir los cuatro avisos de Dart
        working-directory: source/rafahost
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise RuntimeError(f"No se encontró el texto en {path}")
              p.write_text(text.replace(old, new, 1))

