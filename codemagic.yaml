workflows:
  sxz-ios:
    name: SXZ Hosting - Firma y subida
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: "SalmoNot"

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rafastudio.sphost

      vars:
        API_BASE_URL: "https://sxz.rafastudio.tech"
        ADMOB_LIVE: "false"
        BUILD_OFFSET: "100"

    scripts:
      - name: Comprobar configuracion
        script: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ["API_BASE_URL"]
          parsed = urlparse(url)

          if (
              parsed.scheme != "https"
              or not parsed.hostname
              or "TU-DOMINIO" in url.upper()
          ):
              raise SystemExit("Configura una URL HTTPS real.")

          if parsed.path.rstrip("/").endswith("/api"):
              raise SystemExit(
                  "La URL debe indicarse sin /api al final."
              )
          PY

          xcodebuild -version
          flutter --version

      - name: Extraer SXZ Hosting
        script: |
          set -euo pipefail

          unzip -q "$CM_BUILD_DIR/SXZHosting-0.2.0.zip" \
            -d "$CM_BUILD_DIR/source"

          test -f \
            "$CM_BUILD_DIR/source/rafahost/app/pubspec.yaml"

      - name: Corregir avisos de Dart
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/source/rafahost"

          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()

              if old not in text:
                  raise RuntimeError(
                      f"No se encontró el texto esperado en {path}"
                  )

              file.write_text(text.replace(old, new, 1))

          replace(
              "app/lib/data/reward_service.dart",
              "if (!live) return defaultTargetPlatform",
              "if (!live) { return defaultTargetPlatform",
          )

          replace(
              "app/lib/data/reward_service.dart",
              ": 'ca-app-pub-3940256099942544/5224354917';",
              ": 'ca-app-pub-3940256099942544/5224354917'; }",
          )

          replace(
              "app/lib/ui/hosting_model.dart",
              "import 'dart:typed_data';",
              "",
          )

          replace(
              "app/lib/ui/hosting_model.dart",
              "if (signedIn && !busy) run(() async { await loadServers(); if (selected != null) await loadDetail(); });",
              "if (signedIn && !busy) { run(() async { await loadServers(); if (selected != null) await loadDetail(); }); }",
          )

          replace(
              "app/lib/ui/screens.dart",
              "if (action == 'rename') { final name = await askText(context,",
              "if (action == 'rename') { if (!context.mounted) return; final name = await askText(context,",
          )
          PY

      - name: Preparar plataformas y verificar Flutter
        script: |
          set -euo pipefail

          flutter config --no-enable-swift-package-manager

          cd "$CM_BUILD_DIR/source/rafahost"
          bash scripts/bootstrap-flutter.sh

      - name: Configurar identificador nombre y permiso de Fotos
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/source/rafahost/app"

          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          project = Path(
              "ios/Runner.xcodeproj/project.pbxproj"
          )
          text = project.read_text()

          if "dev.rafa.rafahost" not in text:
              raise SystemExit(
                  "No se encontró el Bundle ID original."
              )

          project.write_text(
              text.replace(
                  "dev.rafa.rafahost",
                  "com.rafastudio.sphost",
              )
          )

          plist = Path("ios/Runner/Info.plist")

          with plist.open("rb") as file:
              data = plistlib.load(file)

          data["CFBundleDisplayName"] = "SXZ Hosting"

          data["NSPhotoLibraryUsageDescription"] = (
              "Permite seleccionar fotos para subirlas como archivos "
              "al servidor que administras."
          )

          with plist.open("wb") as file:
              plistlib.dump(data, file)
          PY

      - name: Instalar dependencias iOS
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/source/rafahost/app"

          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("ios/Podfile")
          text = file.read_text()

          pattern = (
              r"(?m)^[ \t]*#?[ \t]*platform[ \t]+:ios[^\n]*"
          )

          if re.search(pattern, text):
              text = re.sub(
                  pattern,
                  "platform :ios, '15.0'",
                  text,
              )
          else:
              text = "platform :ios, '15.0'\n" + text

          file.write_text(text)
          PY

          flutter pub get
          cd ios
          pod install --repo-update

      - name: Aplicar firma de Apple
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/source/rafahost/app"

          xcode-project use-profiles

      - name: Generar IPA firmado
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/source/rafahost/app"

          sxz_build_number=$((BUILD_OFFSET + BUILD_NUMBER + 1))

          if [ "$sxz_build_number" -le 106 ]; then
            echo "El nuevo build debe ser mayor que 106."
            echo "Aumenta BUILD_OFFSET y ejecuta un nuevo build."
            exit 1
          fi

          flutter build ipa \
            --release \
            --build-number="$sxz_build_number" \
            --export-options-plist="$HOME/export_options.plist" \
            --dart-define="API_BASE_URL=$API_BASE_URL" \
            --dart-define="ADMOB_LIVE=$ADMOB_LIVE"

      - name: Verificar permiso dentro del IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/source/rafahost/app"

          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import shutil
          import zipfile

          files = list(Path("build/ios/ipa").glob("*.ipa"))

          if len(files) != 1:
              raise SystemExit(
                  f"Se esperaba un IPA. Encontrados: {len(files)}"
              )

          ipa = files[0]

          with zipfile.ZipFile(ipa) as archive:
              candidates = [
                  name for name in archive.namelist()
                  if name.startswith("Payload/")
                  and name.endswith(".app/Info.plist")
                  and name.count("/") == 2
              ]

              if len(candidates) != 1:
                  raise SystemExit(
                      "No se pudo identificar el Info.plist principal."
                  )

              info = plistlib.loads(
                  archive.read(candidates[0])
              )

          purpose = info.get(
              "NSPhotoLibraryUsageDescription", ""
          )

          if not isinstance(purpose, str) or not purpose.strip():
              raise SystemExit(
                  "Falta el permiso de Fotos dentro del IPA."
              )

          if info.get("CFBundleIdentifier") != "com.rafastudio.sphost":
              raise SystemExit("El IPA tiene un Bundle ID incorrecto.")

          print("Permiso de Fotos verificado dentro del IPA.")
          print("Build:", info.get("CFBundleVersion"))

          destination = Path("dist")
          destination.mkdir(exist_ok=True)

          shutil.copy2(
              ipa,
              destination / "SXZHosting.ipa",
          )
          PY

    artifacts:
      - source/rafahost/app/dist/SXZHosting.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
